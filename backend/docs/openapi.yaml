components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterDeviceRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: dGhpcyBpcyBhIHNhbXBsZSBmY20gdG9rZW4...
        platform:
          type: string
          enum: [ANDROID, IOS, WEB]
          default: ANDROID
          example: ANDROID

    UserDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token:
          type: string
        platform:
          type: string
          enum: [ANDROID, IOS, WEB]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserDeviceResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserDevice'

    UserDeviceListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDevice'

    WebSocketInboundMessage:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [subscribe, unsubscribe, ping]
          example: subscribe
        topic:
          type: string
          example: workshop:84f7b607-e85d-4f10-911b-3f412586bf12

    WebSocketOutboundMessage:
      type: object
      required:
        - event
        - timestamp
      properties:
        event:
          type: string
          enum:
            - PONG
            - SUBSCRIBED
            - UNSUBSCRIBED
            - ERROR
            - QUEUE_CHECKED_IN
            - QUEUE_CALLED
            - QUEUE_STARTED
            - QUEUE_COMPLETED
            - QUEUE_NO_SHOW
            - QUEUE_CANCELLED
            - BOOKING_CREATED
            - BOOKING_CANCELLED
          example: QUEUE_CALLED
        topic:
          type: string
          example: workshop:84f7b607-e85d-4f10-911b-3f412586bf12
        data:
          type: object
        timestamp:
          type: string
          format: date-time
    CreateReviewRequest:
      type: object
      required:
        - booking_id
        - rating
      properties:
        booking_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: "Mekanik handal dan pengerjaan tepat waktu"

    UpdateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        workshop_id:
          type: string
          format: uuid
        rating:
          type: integer
          example: 5
        comment:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        customer:
          $ref: '#/components/schemas/User'

    ReviewDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Review'

    ReviewListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateHistoryItemRequest:
      type: object
      required:
        - spare_part_id
        - quantity
      properties:
        spare_part_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 2

    CreateHistoryRequest:
      type: object
      required:
        - booking_id
      properties:
        booking_id:
          type: string
          format: uuid
        notes:
          type: string
          example: "Selesai ganti oli & kampas rem depan"
        spare_parts:
          type: array
          items:
            $ref: '#/components/schemas/CreateHistoryItemRequest'

    ServiceHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        workshop_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        service_date:
          type: string
          format: date
        service_price:
          type: number
          format: double
          example: 150000.00
        total_price:
          type: number
          format: double
          example: 280000.00
        notes:
          type: string
        spare_parts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceHistorySparePart'
        created_at:
          type: string
          format: date-time
        workshop:
          $ref: '#/components/schemas/Workshop'
        service:
          $ref: '#/components/schemas/Service'

    ServiceHistorySparePart:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_history_id:
          type: string
          format: uuid
        spare_part_id:
          type: string
          format: uuid
        quantity:
          type: integer
          example: 2
        price_per_unit:
          type: number
          format: double
          example: 65000.00
        subtotal:
          type: number
          format: double
          example: 130000.00
        created_at:
          type: string
          format: date-time
        spare_part:
          $ref: '#/components/schemas/SparePart'

    ServiceHistoryDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ServiceHistory'

    ServiceHistoryListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ServiceHistory'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    Queue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        workshop_id:
          type: string
          format: uuid
        queue_date:
          type: string
          format: date
        queue_number:
          type: integer
          example: 1
        status:
