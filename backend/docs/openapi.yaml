openapi: 3.0.3
info:
  title: Bengkol Workshop & Repair-Shop Management API
  description: |
    Production-ready REST API for the Bengkol auto repair-shop platform.
    Connects vehicle owners with nearby repair shops for slot booking, real-time queues, service catalogs, inventory, and reviews.
  version: 1.0.0
  contact:
    name: Bengkol Engineering
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.bengkol.com
    description: Production server

paths:
  /health:
    get:
      summary: Liveness health check
      tags:
        - Observability
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /ready:
    get:
      summary: Readiness health check
      tags:
        - Observability
      responses:
        '200':
          description: Service and downstream dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '503':
          description: Downstream dependency is failing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ping:
    get:
      summary: API v1 status ping
      tags:
        - System
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/register:
    post:
      summary: Register user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/login:
    post:
      summary: Authenticate user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/me:
    get:
      summary: Get authenticated user profile
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /api/v1/workshops:
    get:
      summary: List workshops
      tags:
        - Workshops
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: List of workshops
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkshopListResponse'
    post:
      summary: Create a new workshop
      tags:
        - Workshops
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkshopRequest'
      responses:
        '201':
          description: Workshop created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkshopDetailResponse'

  /api/v1/workshops/nearby:
    get:
      summary: Find nearby workshops via PostGIS spatial search
      tags:
        - Workshops
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            format: double
        - in: query
          name: lng
          required: true
          schema:
            type: number
            format: double
        - in: query
          name: radius
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Nearby workshops ordered by distance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyWorkshopsResponse'

  /api/v1/workshops/{id}:
    get:
      summary: Get workshop detail
      tags:
        - Workshops
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workshop details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkshopDetailResponse'
    patch:
      summary: Update workshop profile
      tags:
        - Workshops
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkshopRequest'
      responses:
        '200':
          description: Updated workshop details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkshopDetailResponse'

  /api/v1/workshops/{id}/operating-hours:
    get:
      summary: Get workshop operating hours
      tags:
        - Workshops
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of operating schedules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatingHoursResponse'
    put:
      summary: Set weekly operating hours
      tags:
        - Workshops
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OperatingHourInput'
      responses:
        '200':
          description: Updated operating hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatingHoursResponse'

  /api/v1/workshops/{id}/available-slots:
    get:
      summary: Get available booking slots for a workshop on a date
      description: Returns capacity-checked available time slots within operating hours for the given date.
      tags:
        - Bookings
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: date
          schema:
            type: string
            format: date
          example: "2026-09-28"
      responses:
        '200':
          description: Available slots schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableSlotsResponse'

  /api/v1/bookings:
    post:
      summary: Book a service appointment slot
      description: Creates a concurrency-safe slot reservation. Double-booking is strictly prevented via transactional locking.
      tags:
        - Bookings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailResponse'
        '409':
          description: Slot capacity exhausted (BOOKING_SLOT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bookings/{id}:
    get:
      summary: Get booking details
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailResponse'

  /api/v1/bookings/{id}/cancel:
    post:
      summary: Cancel a booking
      description: Cancels a reservation and restores slot capacity. Allowed for the customer, workshop owner, or admin.
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/me/bookings:
    get:
      summary: List authenticated customer's bookings
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: List of customer bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'

  /api/v1/workshops/{id}/bookings:
    get:
      summary: List bookings for a workshop (Owner / Admin)
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Workshop bookings list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'

  /api/v1/workshops/{id}/services:
    get:
      summary: List services for a workshop
      tags:
        - Services
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
    post:
      summary: Create a service in a workshop
      tags:
        - Services
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetailResponse'

  /api/v1/services/{id}:
    get:
      summary: Get service details
      tags:
        - Services
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetailResponse'
    patch:
      summary: Update service
      tags:
        - Services
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Updated service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetailResponse'
    delete:
      summary: Delete service
      tags:
        - Services
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/workshops/{id}/spare-parts:
    get:
      summary: List spare parts for a workshop
      tags:
        - Spare Parts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of spare parts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparePartListResponse'
    post:
      summary: Add spare part to workshop inventory
      tags:
        - Spare Parts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSparePartRequest'
      responses:
        '201':
          description: Spare part added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparePartDetailResponse'

  /api/v1/spare-parts/{id}:
    get:
      summary: Get spare part details
      tags:
        - Spare Parts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Spare part details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparePartDetailResponse'
    patch:
      summary: Update spare part
      tags:
        - Spare Parts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSparePartRequest'
      responses:
        '200':
          description: Updated spare part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparePartDetailResponse'
    delete:
      summary: Delete spare part
      tags:
        - Spare Parts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Spare part deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/bookings/{id}/check-in:
    post:
      summary: Check in for a confirmed booking on service day to get a queue ticket
      tags:
        - Queue
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Queue ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetailResponse'

  /api/v1/queues/{id}:
    get:
      summary: Get queue ticket details and live wait estimation
      tags:
        - Queue
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetailResponse'

  /api/v1/me/queue/active:
    get:
      summary: Get customer's active queue ticket for today
      tags:
        - Queue
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active queue ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetailResponse'

  /api/v1/workshops/{id}/queues:
    get:
      summary: List workshop queue tickets for a date
      tags:
        - Queue
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: date
          schema:
            type: string
            format: date
        - in: query
          name: status
          schema:
            type: string
            enum: [WAITING, CALLED, IN_SERVICE, COMPLETED, NO_SHOW, CANCELLED]
      responses:
        '200':
          description: Workshop queue list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueListResponse'

  /api/v1/workshops/{id}/queues/summary:
    get:
      summary: Get live queue board summary for a workshop
      tags:
        - Queue
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Workshop queue summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSummaryResponse'

  /api/v1/workshops/{id}/queues/call-next:
    post:
      summary: Call next waiting customer in queue
      tags:
        - Queue
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Called queue ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetailResponse'

  /api/v1/queues/{id}/call:
    post:
      summary: Call specific queue ticket
      tags:
        - Queue
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue called
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetailResponse'

  /api/v1/queues/{id}/start:
    post:
      summary: Start service for a queue ticket
      tags:
        - Queue
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetailResponse'

  /api/v1/queues/{id}/complete:
    post:
      summary: Complete service for a queue ticket
      tags:
        - Queue
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetailResponse'

  /api/v1/queues/{id}/no-show:
    post:
      summary: Mark queue ticket customer as no-show
      tags:
        - Queue
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue marked as no-show
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetailResponse'

  /api/v1/queues/{id}/cancel:
    post:
      summary: Cancel a queue ticket
      tags:
        - Queue
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetailResponse'

  /api/v1/workshops/{id}/service-histories:
    post:
      summary: Finalize service, decrement parts inventory, and record immutable history
      tags:
        - Service History
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHistoryRequest'
      responses:
        '201':
          description: Service history recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHistoryDetailResponse'
    get:
      summary: List service history records for a workshop
      tags:
        - Service History
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of workshop service histories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHistoryListResponse'

  /api/v1/service-histories/{id}:
    get:
      summary: Get service history record details
      tags:
        - Service History
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service history details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHistoryDetailResponse'

  /api/v1/bookings/{id}/service-history:
    get:
      summary: Get service history associated with a booking
      tags:
        - Service History
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service history details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHistoryDetailResponse'

  /api/v1/me/service-histories:
    get:
      summary: List customer's service histories
      tags:
        - Service History
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of customer's service histories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHistoryListResponse'

  /api/v1/reviews:
    post:
      summary: Submit rating and review for a completed booking
      tags:
        - Reviews
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'

  /api/v1/reviews/{id}:
    get:
      summary: Get review details by ID
      tags:
        - Reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
    patch:
      summary: Update a submitted review
      tags:
        - Reviews
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'

  /api/v1/bookings/{id}/review:
    get:
      summary: Get review for a specific booking
      tags:
        - Reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking review details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'

  /api/v1/workshops/{id}/reviews:
    get:
      summary: List reviews and ratings for a workshop
      tags:
        - Reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
  /api/v1/ws:
    get:
      summary: Real-time WebSocket connection for live queue, booking, and workshop event broadcasts
      description: |
        Upgrades the HTTP connection to a full-duplex WebSocket connection.
        Authentication token can be supplied via `?token=<access_token>` query parameter or `Authorization: Bearer <token>` header.
        Upon connection, clients are automatically subscribed to their own topic `user:<userID>`.
        Clients can send JSON commands to `subscribe`, `unsubscribe`, or `ping`.
      tags:
        - Real-Time WebSocket
      parameters:
        - in: query
          name: token
          description: JWT Access Token
          required: false
          schema:
            type: string
        - in: header
          name: Upgrade
          required: true
          schema:
            type: string
            example: websocket
        - in: header
          name: Connection
          required: true
          schema:
            type: string
            example: Upgrade
      responses:
        '101':
          description: Switching Protocols to WebSocket
        '401':
          description: Missing, invalid, or expired authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

