services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bengkol_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bengkol_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bengkol_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bengkol_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bengkol_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_NAME: bengkol-api
      LOG_LEVEL: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: bengkol_db
      DB_SSL_MODE: disable
      JWT_ACCESS_SECRET: dev-jwt-access-secret-32-chars-long!
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-32-chars-long!
      JWT_ACCESS_EXPIRY_MINUTES: 15
      JWT_REFRESH_EXPIRY_DAYS: 7
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bengkol_network

volumes:
  postgres_data:
    driver: local

networks:
  bengkol_network:
    driver: bridge
