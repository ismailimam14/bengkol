# ==============================================================================
# Docker Compose Override: UAT Environment
# Usage: docker compose -f docker-compose.yml -f docker-compose.uat.yml up -d
# ==============================================================================
services:
  backend:
    environment:
      APP_ENV: uat
      APP_NAME: bengkol-api-uat
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: "https://uat.bengkol.com,https://uat-admin.bengkol.com,http://localhost:3000"
    ports:
      - "8080:8080"
