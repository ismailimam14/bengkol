# ==============================================================================
# Docker Compose Override: STAGING Environment
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# ==============================================================================
services:
  backend:
    environment:
      APP_ENV: staging
      APP_NAME: bengkol-api-staging
      LOG_LEVEL: info
      DB_SSL_MODE: require
      CORS_ALLOWED_ORIGINS: "https://staging.bengkol.com,https://staging-admin.bengkol.com"
    ports:
      - "8080:8080"
